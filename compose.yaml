services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bicicletas
      POSTGRES_USER: projeto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto -d bicicletas"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
